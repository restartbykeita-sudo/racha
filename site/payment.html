<!doctype html>
<html lang="th"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100d1d"><title>ชำระงวดถัดไป · RESTART</title>
<link rel="stylesheet" href="style.css">
<script defer src="https://cdn.jsdelivr.net/npm/sweetalert2@11.26.25/dist/sweetalert2.all.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script defer src="alerts.js"></script><script defer src="config.js"></script><script defer src="payment.js?v=20260930-1"></script>
<style>
:root{--event-bg:#100d1d;--event-surface:#1d192c;--event-text:#f7f3ff;--event-accent:#ffb097;--event-secondary:#7044c0}
body{background:radial-gradient(circle at 80% -12%,color-mix(in srgb,var(--event-secondary) 52%,transparent),transparent 35%),var(--event-bg);color:var(--event-text)}
.panel{background:color-mix(in srgb,var(--event-surface) 93%,transparent)}.pay-hero{padding:28px;border:1px solid #493d59;border-radius:22px;background:var(--event-surface);margin-bottom:20px}.pay-hero h1{font-size:clamp(28px,5vw,48px);margin:8px 0}
.lookup-card{max-width:720px;margin:auto}.payment-total{font-size:34px;font-weight:900;color:var(--event-accent)}
.pay-card{border:1px solid #514461;border-radius:14px;padding:15px;background:#ffffff05}.pay-card code{font-size:16px;word-break:break-all}
#qrCode{background:#fff;padding:12px;border-radius:12px;width:max-content;margin-top:12px}.copy-button{border:1px solid #6c5874;background:#342a46;color:#fff;border-radius:8px;padding:7px 9px}
.status-line{display:flex;justify-content:space-between;gap:12px;border:1px solid #493d59;padding:12px;border-radius:11px;margin-bottom:8px}
</style></head>
<body>
<header class="site-header wrap"><a class="brand" href="events.html"><span class="brand-mark">R</span><span>RESTART <small>PAYMENT</small></span></a><a id="backRegister" class="small-button" href="events.html">กลับหน้าสมัคร</a></header>
<main class="wrap">
<section class="pay-hero"><span class="eyebrow">NEXT INSTALLMENT</span><h1 id="eventName">ชำระงวดถัดไป</h1><p class="muted">ใช้เลขบัตรประชาชน/Passport พร้อมรหัสสมัคร เพื่อปกป้องข้อมูลของผู้สมัคร</p></section>
<section class="panel lookup-card">
<form id="lookupForm" class="admin-form" novalidate>
<label class="field"><span>เลขบัตรประชาชน / Passport</span><input id="idDocument" required autocomplete="off"></label>
<label class="field"><span>รหัสสมัคร</span><input id="registrationCode" required autocomplete="off" placeholder="RST-..."></label>
<button class="primary" type="submit">ค้นหาใบสมัคร</button>
</form>
<div id="result" class="hidden" style="margin-top:24px">
<hr style="border:0;border-top:1px solid #493d59;margin:0 0 22px">
<div class="toolbar"><div><span class="eyebrow">PAYMENT STATUS</span><h2 id="personName" style="margin:6px 0"></h2><p id="summary" class="muted"></p></div><div><span class="muted">ยอดสมัคร</span><div id="totalAmount" class="payment-total"></div></div></div>
<div id="scheduleList"></div>
<div id="nextBlock" class="hidden" style="margin-top:22px">
<h3 id="nextTitle"></h3><div id="methods" class="stack"></div>
<form id="payForm" class="stack" style="margin-top:16px"><label class="field"><span>แนบสลิปชำระเงิน</span><input id="slip" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required></label><button class="primary" type="submit">ส่งสลิปงวดนี้</button></form>
</div>
<div id="complete" class="receipt hidden" style="margin-top:18px">ชำระครบทุกงวดแล้ว</div>
</div>
</section>
</main><footer class="wrap footer"><span>RESTART REGISTRATION PLATFORM</span><a href="events.html">Event ทั้งหมด</a></footer>
</body></html>
