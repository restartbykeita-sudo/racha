<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100d1d">
  <title>RESTART · Events</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1"></script>
  <script defer src="config.js"></script>
  <script defer src="events.js?v=20260930-1"></script>
  <style>
    .event-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:22px}
    .event-card{overflow:hidden;border:1px solid #493d59;background:#1d192c;border-radius:22px;text-decoration:none;display:block;transition:.18s}
    .event-card:hover{transform:translateY(-3px);border-color:#ff92aa;box-shadow:0 18px 50px #0005}
    .event-cover{height:220px;background:#242033;display:grid;place-items:center;overflow:hidden}.event-cover img{width:100%;height:100%;object-fit:cover}
    .event-card-body{padding:20px}.event-card h2{margin:7px 0 8px}.event-card p{color:#bdb5ca;line-height:1.55}
    .event-badges{display:flex;gap:8px;flex-wrap:wrap}.event-badge{border:1px solid #5b4c69;border-radius:99px;padding:6px 9px;font-size:11px}
    @media(max-width:760px){.event-grid{grid-template-columns:1fr}.event-cover{height:180px}}
  </style>
</head>
<body>
<header class="site-header wrap">
  <a class="brand" href="events.html"><span class="brand-mark">R</span><span>RESTART <small>REGISTRATION</small></span></a>
  <a class="small-button" href="admin.html">สำหรับเจ้าหน้าที่</a>
</header>
<main class="wrap">
  <section class="hero" style="min-height:250px">
    <div class="hero-copy"><span class="eyebrow">RESTART EVENTS</span><h1>เลือก <em>EVENT</em> ที่ต้องการสมัคร</h1><p>ระบบสมัครกลางของ RESTART</p></div>
  </section>
  <div id="loading" class="panel" style="margin-top:22px">กำลังโหลด Event…</div>
  <div id="eventGrid" class="event-grid"></div>
</main>
<footer class="wrap footer"><span>RESTART REGISTRATION PLATFORM</span><a href="admin.html">Admin</a></footer>
</body>
</html>
